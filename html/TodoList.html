<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项TodoList</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        #app {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        #taskInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        .todo-item {
            background-color: #fff;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 6px 0;
        }
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        .button-group {
            display: flex;
            gap: 5px;
        }
        .button-group button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;
        }
        #completionButton {
            background-color: #585a58;
        }
        #editButton {
            background-color: #4CAF50;
        }
        #deleteButton {
            background-color: #f44336;
        }

    </style>
</head>
<body>
    <h1>待办任务列表</h1>
    <div id="app">
        <form @submit.prevent="addTask">
            <input id="taskInput" type="text" v-model="taskText" placeholder="请输入任务内容，按回车键添加...">
        </form>
        <ul>
            <li class="todo-item" v-for="(todo, index) in todos" :key="index">
                <span v-if="editIndex !== index" :class="{'completed': todo.completed}">任务{{index + 1}} : {{ todo.text }}</span>
                <input v-else type="text" v-model="todo.text" @keyup.enter="finishEditTask(index)">
                <div class="button-group">
                    <button id="completionButton" type="button" @click="toggleTaskCompletion(index)">
                        {{ todo.completed ? '已完成' : '未完成' }}
                    </button>
                    <button id="editButton" type="button" @click="editTask(index)" v-if="editIndex !== index">编辑</button>
                    <button id="deleteButton" type="button" @click="removeTask(index)">删除</button>
                </div>
            </li>
        </ul>
        <div>
            <p>总任务数: {{ todos.length }}</p>
            <p>已完成任务数: {{ finishCount }}</p>
            <p>未完成任务数: {{ unFinishCount }}</p>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script> 
        const{createApp} = Vue;
        createApp({
            data(){
                return{
                    todos:JSON.parse(localStorage.getItem('todos'))||[],
                    taskText:'',
                    editIndex:null,
                }
            },
            computed:{
                finishCount(){
                    return this.todos.filter(todo=>todo.completed).length;
                },
                unFinishCount(){
                    return this.todos.filter(todo=>!todo.completed).length;
                }
            },
            methods:{
                addTask(){
                    if(this.taskText.trim()!==''){
                        this.todos.push({
                            text:this.taskText,
                            completed:false
                        });
                        this.taskText='';
                        this.saveTasksToLocalStorage();
                    }
                },
                removeTask(index){
                    this.todos.splice(index,1);
                    this.saveTasksToLocalStorage();
                },
                toggleTaskCompletion(index){
                    this.todos[index].completed=!this.todos[index].completed;
                },
                editTask(index){
                    this.editIndex=index;
                },
                finishEditTask(index){
                    if(this.todos[index].text.trim()===''){     
                        this.todos.splice(index,1)
                    }else{
                        this.todos[index].text=this.todos[index].text.trim();
                    }
                    this.editIndex=null;
                    this.saveTasksToLocalStorage();
                },
                saveTasksToLocalStorage(){
                    localStorage.setItem('todos',JSON.stringify(this.todos));
                },
            },
        }).mount('#app');
    </script>
</body>
</html>
