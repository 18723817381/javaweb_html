        </nav>
    </header>
    <main>
        <h1>欢迎给我留言~</h1>
        <section>
            <form class="message-form" action="#" method="post">
                <label for="name">姓名:</label>
                <input type="text" id="name" name="name" placeholder="例如：小林" required><br><br>

                <label for="email">邮箱:</label>
                <input type="email" id="email" name="email" placeholder="例如：example@email.com" required><br><br>

                <label for="message">留言内容:(不超过300字)</label><br>
                <textarea id="msgcontent" name="msgcontent" rows="5" cols="40" required></textarea><br><br>

                <input type="submit" value="提交留言">
            </form>
            <h3>留言列表</h3>
            <p id="message-count"></p>
            <ul id="message-list" class="message-list"></ul>
        </section>
    </main>
    <footer>
        <p>探索自我，展示未来</p>
    </footer>
</body>
</html>
