<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="icon" href="picture/head.jpg" type="image/x-icon">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/register.css">
    <script src="JS/register.js" defer></script>
</head>
<body>
    <div class="register-box">
        <h2>注册博客账号</h2>
        <form id="regForm">
            <div class="item">
                <label>用户名<br></label>
                <input type="text" id="username">
                <p class="tip" id="userTip"></p>
            </div>
            <div class="item">
                <label>邮箱<br></label>
                <input type="text" id="email">
                <p class="tip" id="emailTip"></p>
            </div>
            <div class="item">
                <label>手机号码<br></label>
                <input type="text" id="phone">
                <p class="tip" id="phoneTip"></p>
            </div>
            <div class="item">
                <label>密码<br></label>
                <input type="password" id="pwd">
                <p class="tip" id="pwdTip"></p>
            </div>
            <div class="item">
                <label>确认密码<br></label>
                <input type="password" id="rePwd">
                <p class="tip" id="rePwdTip"></p>
            </div>
            <input type="submit" id="submitBtn" value="提交注册">
            <p id="resultMsg"></p>
        </form>
    </div>

</body>
</html>
